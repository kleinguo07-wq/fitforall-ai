<!doctype html>
<html lang="zh-CN">
<head>
 <meta charset="utf-8">
 <meta name="viewport" content="width=device-width,initial-scale=1">
 <title>FitForAll AI · v1.1 产品评审</title>
 <link rel="stylesheet" href="style.css?v=backlog-split-26">
</head>
<body>
 <aside class="sidebar">
  <a class="brand" href="#"><span class="brand-icon">F</span><span>FitForAll<span class="brand-ai"> AI</span><small>全民健身 · 产品工作台</small></span></a>
  <div class="release">V1.1 <span>需求评审稿</span></div>
  <p class="nav-label">评审空间</p>
  <nav>
   <button class="nav" data-view="spec">☷ <span>评审说明</span><em>01</em></button>
   <button class="nav active" data-view="device">▣ <span>原型体验</span><em>02</em></button>
   <div class="prototype-subnav" aria-label="原型体验页面目录">
    <section class="prototype-group"><h3>交互大屏</h3>
     <button data-review-page="video"><span>D01</span><b>视频屏保</b><em>4</em></button>
     <button data-review-page="audience"><span>D02</span><b>趣运动项目同步</b><em>2</em></button>
     <button data-doc-target="D03"><span>D03</span><b>线上问题修正</b><em>文本</em></button>
     <button data-doc-target="D04"><span>D04</span><b>老年内容扩充</b><em>文本</em></button>
    </section>
    <section class="prototype-group"><h3>管理后台</h3>
     <button data-admin-page="screen"><span>B01</span><b>屏保管理</b><em>4</em></button>
    </section>
   </div>
   <button class="nav" data-view="docs">▤ <span>需求文档</span><em>03</em></button>
   <button class="nav" data-view="tracking">▦ <span>埋点</span><em>04</em></button>
   <a class="nav backlog-link" href="../backlog/">▧ <span>待开发需求池</span><em>待排期</em></a>
  </nav>
 </aside>
 <main>
  <header class="topbar"><div><span class="eyebrow">PRODUCT REVIEW / 2026</span><h1 id="view-title">激发用户使用互动屏</h1></div><span class="draft-badge">● 待评审</span></header>
  <section id="device-view" class="workspace">
   <div class="stage-area">
    <div class="stage-meta">
     <span>设备端 <b>9:16</b></span>
     <span class="stage-meta-actions"><span id="screen-label">视频屏保</span><button id="open-requirements" class="requirements-entry hidden" aria-expanded="false" aria-controls="context-requirements">查看本页需求</button></span>
    </div>
    <div class="stage-canvas">
     <div class="device-wrap"><div class="device" id="device"></div></div>
     <aside id="context-requirements" class="context-requirements" aria-hidden="true">
      <header><span>本页需求</span><button id="close-requirements" aria-label="关闭本页需求">×</button></header>
      <h2 id="context-requirements-title"></h2>
      <ul id="context-requirements-list"></ul>
     </aside>
    </div>
    <div class="stage-foot"><span class="dot"></span> 竖屏触控预览 <span>所有身份与成绩均为模拟</span></div>
   </div>
   <aside class="inspector">
    <div class="inspector-head"><span class="eyebrow">PAGE REVIEW</span><h2>本页需求与演示</h2><p><span id="inspector-current-title">视频屏保</span><b id="inspector-change-count">4 项变动</b></p></div>
    <p id="inspector-priority" class="inspector-priority"></p>
    <div class="control-group current-page-requirements"><h3>本页需求</h3><ul id="inspector-requirements-list"></ul></div>
    <div id="person-controls" class="control-group" data-pages="guide data-screen"><h3>模拟本页使用者</h3><label class="field-label" for="person">用户</label><select id="person"><option value="chen">陈阿姨 · 老用户</option><option value="wang">王叔叔 · 老用户</option><option value="new">新用户 · 尚未注册</option></select><div data-pages="guide"><label class="field-label" for="identity">身份确认结果</label><select id="identity"><option value="success">识别成功</option><option value="failure">人脸识别失败</option></select></div></div>
    <div id="timing-controls" class="control-group" data-pages="video exercise audience"><h3>本页演示控制</h3><div data-pages="video exercise"><label class="field-label" for="speed">预览 / 运动时间速度</label><select id="speed"><option value="1">正常速度 ×1</option><option value="5">评审加速 ×5</option><option value="30">评审加速 ×30</option></select></div><div class="scenario-grid tight"><button id="advance" data-pages="video exercise">推进 10 秒</button><button id="fail-video" data-pages="video">当前视频失败</button><button id="empty" data-pages="video">模拟空内容池</button></div><div data-pages="audience"><span class="field-label">人群内容页</span><div class="scenario-grid"><button id="audience-adult">成人 · 热力健将</button><button id="audience-youth">儿童 · 跃动少年</button></div></div></div>
    <div class="status-box"><span class="eyebrow">当前状态</span><p id="state-detail"></p><div id="event-log"></div></div>
    <div class="assumption"><b>本页说明</b><p id="page-assumption-text"></p></div>
    <button id="reset" class="reset hidden" tabindex="-1">重置全部演示数据</button>
   </aside>
  </section>
  <section id="admin-view" class="hidden"></section>
  <section id="spec-view" class="hidden"></section>
  <section id="docs-view" class="hidden"></section>
  <section id="tracking-view" class="hidden"></section>
 </main>
 <div id="toast" role="status"></div>
  <script src="core.js?v=backlog-split-26"></script>
 <script src="app.js?v=backlog-split-26"></script>
</body>
</html>
