<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>管理后台 · v1.0评审原型</title><style>
:root{--blue:#2878df;--line:#e5e9ef;--text:#303b4a;--muted:#7d8998}*{box-sizing:border-box}body{margin:0;color:var(--text);background:#f4f6f9;font:14px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}button,input,textarea,select{font:inherit}button,a{cursor:pointer}button{border:1px solid #d8dee7;border-radius:5px;background:white;color:inherit;padding:8px 16px}button:disabled{opacity:.5;cursor:default}button.primary{background:var(--blue);color:white;border-color:var(--blue)}button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #a4caff;outline-offset:3px}a{color:var(--blue);text-decoration:none}.review{padding:12px 24px;display:flex;justify-content:space-between;align-items:center;gap:16px;background:#fff;border-bottom:1px solid var(--line)}.review small{color:var(--muted);margin-left:14px}.review nav{display:flex;gap:18px;align-items:center}.review button{font-size:12px}.layout{display:grid;grid-template-columns:202px minmax(0,1fr);min-height:calc(100vh - 65px)}.sidebar{background:#202e42;color:#aeb9c9;padding:22px 14px}.brand{color:white;font-size:17px;font-weight:650;margin:0 12px 36px}.menu-label{font-size:12px;color:#8190a4;margin:25px 14px 10px}.menu-static{padding:11px 14px}.sidebar button{width:100%;display:flex;gap:12px;align-items:center;padding:13px 14px;margin:5px 0;border:0;background:transparent;color:#c8d3e3;text-align:left}.sidebar button.active{background:#2c78dc;color:white}.sidebar svg{width:19px;height:19px}.shell{min-width:0}.topbar{height:66px;background:white;padding:0 28px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);color:#667486}.avatar{background:#eaf1fd;color:#326fb8;padding:6px 10px;border-radius:18px}main{padding:28px;max-width:1700px;margin:auto}h1{font-size:23px;margin:0 0 22px}h2{font-size:18px;margin:0 0 14px}.panel{background:white;border:1px solid var(--line);border-radius:7px;padding:24px;min-height:500px}.product-tabs{display:flex;gap:18px;border-bottom:1px solid var(--line);padding-bottom:22px}.product-tab{display:flex;gap:14px;align-items:center;min-width:250px;padding:17px 22px;text-align:left;background:#fff;border:1px solid #dce2ea;border-radius:7px}.product-tab[aria-selected=true]{border-color:var(--blue);background:#eef5ff;color:#1c65c2;box-shadow:inset 0 0 0 1px var(--blue)}.product-tab svg{width:43px;height:43px;flex-shrink:0}.product-tab b{display:block;font-size:17px}.product-tab small{display:block;color:#8492a4}.toolbar{display:flex;justify-content:space-between;gap:18px;align-items:center;margin:22px 0 16px}.status-tabs{display:flex;gap:24px}.status-tabs button{padding:10px 0;border:0;border-bottom:2px solid transparent;border-radius:0;background:transparent}.status-tabs button.active{color:var(--blue);border-bottom-color:var(--blue)}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;white-space:nowrap;font-size:13px}th{background:#f6f8fb;color:#718095;font-weight:500}td,th{text-align:left;padding:15px 12px;border-bottom:1px solid #edf0f5}td .tag{background:#f0f5fa;color:#6f8297;padding:3px 8px;border-radius:3px}.preview{height:48px;width:78px;background:#edf2f7;display:grid;place-items:center;border:1px solid #e4eaf0;border-radius:4px;color:#698099}.preview svg{width:23px;height:23px}.text-button{border:0;color:var(--blue);background:none;padding:4px}.list-meta{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;padding-top:18px}.empty{text-align:center;padding:64px 16px;color:var(--muted)}.empty b{display:block;font-size:17px;margin-bottom:12px}.scope-alert{padding:13px 16px;background:#edf5ff;border:1px solid #cfE2ff;color:#2866ae;border-radius:5px;margin-bottom:26px}.notice-layout{display:grid;grid-template-columns:minmax(320px,1fr) minmax(250px,.8fr);gap:42px;align-items:start}.form-row{margin-bottom:23px}label{display:block;font-weight:550;margin-bottom:8px}input,textarea{border:1px solid #d8dee7;border-radius:5px;padding:10px 12px;width:100%;color:var(--text);background:white}textarea{resize:vertical;min-height:145px}.fixed-product{background:#f4f6fa;display:inline-flex;align-items:center;gap:10px;border:1px solid #e0e5ed;border-radius:5px;padding:8px 13px}.fixed-product svg{width:26px;height:26px}.hint{font-size:12px;color:var(--muted);margin:7px 0 0}.actions{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.notice-state{font-size:12px;color:#7b8796;margin-bottom:16px}.state-pill{background:#e7f5ec;color:#27864a;padding:3px 8px;border-radius:4px}.preview-frame{border:7px solid #263b36;border-radius:12px;background:#f7f8ef;aspect-ratio:16/9;display:flex;flex-direction:column;padding:16px 18px;overflow:hidden}.preview-frame h3{margin:0;font-size:15px;color:#204c3e}.preview-content{flex:1;display:flex;align-items:center;justify-content:center;color:#94a297;font-size:13px}.preview-notice{border-top:1px solid #dce5d6;padding-top:8px;display:flex;gap:8px;color:#547260;font-size:12px;min-width:0}.preview-notice b{flex-shrink:0}.preview-notice span{white-space:nowrap;text-overflow:ellipsis;overflow:hidden}.error{color:#cf3b32;font-size:13px;min-height:22px;margin-bottom:12px}.review-tools{margin:18px 0;color:#78879a;font-size:12px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}.review-tools select{border:1px solid #dbe2eb;border-radius:4px;padding:5px}.help{background:#fff;border:1px solid #dbe5f4;padding:24px;margin-top:18px;line-height:1.85}.help h3{font-size:15px}.help li{margin:9px 0}.help .id{color:#7c8ba0;font-size:12px}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#233d58;color:white;padding:12px 22px;border-radius:7px;z-index:5;max-width:90%}.review-notice{font-size:12px;color:#718095;padding:16px 28px 24px}.toolbar svg{width:16px;height:16px;vertical-align:middle;margin-right:6px}[hidden]{display:none!important}@media(max-width:1000px){.layout{grid-template-columns:155px minmax(0,1fr)}main{padding:20px}.panel{padding:20px}.product-tab{min-width:0;flex:1;padding:14px}.product-tab b{font-size:15px}.notice-layout{grid-template-columns:1fr}.notice-preview{max-width:540px}.review small{display:block;margin:0}.review nav{gap:12px}}@media(max-width:650px){.layout{grid-template-columns:1fr}.sidebar{padding:10px;display:flex;align-items:center;gap:8px}.brand,.menu-static,.menu-label{display:none}.sidebar button{width:auto;margin:0}.review{padding:12px 16px;align-items:flex-start}.review nav{flex-wrap:wrap;justify-content:flex-end}.topbar{padding:0 20px}.product-tabs{gap:10px}.product-tab{flex-direction:column;align-items:flex-start;padding:12px}.product-tab b{font-size:13px}.product-tab svg{width:32px;height:32px}.notice-layout{grid-template-columns:minmax(0,1fr)}}
</style></head><body><header class="review"><div><b>管理后台 / v1.0评审原型</b><small>新增产品切换与公告设置 · 2026.11.06</small></div><nav><a href="../">横屏项目</a><a href="index.html#home">屏端原型</a><button id="help-toggle" aria-expanded="false">原型说明</button></nav></header><div class="layout"><aside class="sidebar"><div class="brand">社会体育管理后台</div><div class="menu-label">内容管理</div><button data-page="videos"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m10 9 5 3-5 3z"/></svg>运动视频</button><button data-page="notice"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="m4 10 14-5v14L4 14zM4 10v4M6 15l2 6h4l-2-5M21 9v6"/></svg>公告设置</button><div class="menu-label">已有功能参照</div><div class="menu-static">数据统计</div><div class="menu-static">用户管理</div><div class="menu-static">账号管理</div><div class="menu-static">屏保管理</div></aside><div class="shell"><header class="topbar"><span id="crumb">内容管理 / 运动视频</span><span class="avatar">示例公园 · 管理员</span></header><main><div id="view"></div><div class="review-tools"><b>评审状态</b><select id="scenario" aria-label="评审状态"><option value="normal">正常</option><option value="empty">视频列表为空</option><option value="failed">视频加载失败</option><option value="saveFailed">公告保存失败</option></select><button id="reset">重置演示</button></div><section class="help" id="help" hidden></section></main><footer class="review-notice">独立评审示意 · 列表和配置均为模拟，刷新后重置。未接入真实后台、上传和屏端同步服务；原始页面及账号信息未公开。</footer></div></div><div class="toast" id="toast" role="status" hidden></div><script type="application/json" id="requirements">{"version": "v1.0", "date": "2026-11-06", "title": "管理后台 · 视频分产品与公告设置", "status": "本期需求与独立评审示意，真实接口未接入", "reference": "用户提供的运动视频页面HTML仅证明可见页面结构，未核对真实后台源码与接口。", "features": [{"id": "ADMIN-VIDEO-001", "title": "运动视频按产品切换", "scope": "在运动视频页面内容区顶部增加AI全民健身机、AI全民运动站两个图标文字Tab；位于原有已发布视频/草稿箱与上传按钮上方。", "rules": ["初次进入默认AI全民健身机，保留现有视频管理入口与数据归属，不自动搬移或复制旧视频到运动站。", "竖屏轮廓图标对应AI全民健身机，横屏轮廓图标对应AI全民运动站；同时展示文字与选中态，支持键盘切换。", "切换产品刷新下方列表，回到已发布视频和第一页，原有筛选条件重置；切换已发布视频/草稿箱只查询当前产品。", "沿用现有表格字段、预览、上传及已有操作；上传与编辑带当前产品上下文，产品间记录不得串用。若分页存在则沿用，切换清除旧数据，异步返回只呈现当前产品的请求结果。", "加载、空列表和请求失败须在当前产品内反馈，可重试；同一素材是否共用由接口实现确定，不据此新增跨产品复制功能。"], "acceptance": ["两Tab名称、图标与顺序准确，初次默认全民健身机。", "两产品的已发布视频、草稿箱、上传及编辑目标正确，不混合显示或写入。", "快速连续切换不闪回旧列表；空态、失败重试及分页重置正确。"], "design": ["新增竖屏设备与横屏设备图标各1个，复用现有图标规范和选中/未选中Tab样式。", "复用原列表、状态Tab、上传入口及已有操作，不新增整套视频管理流程。"]}, {"id": "ADMIN-NOTICE-001", "title": "全民运动站公告设置", "scope": "管理后台新增公告设置入口，本期维护一条当前公告；创建或编辑后保存并展示到当前管理范围内的AI全民运动站。", "rules": ["页面固定展示提示：公告仅支持在AI全民运动站展示，不支持AI全民健身机。适用产品固定为AI全民运动站，不可切换。", "公告名称默认公告，支持修改；名称留空保存时使用公告。公告内容必填，去除首尾空白后为空不得保存；作为纯文本展示。", "未创建时展示空表单；保存并展示成功后状态为展示中，已创建可编辑覆盖当前公告，不创建多条历史列表。", "支持隐藏与重新展示当前已保存公告；隐藏不删除内容。重新展示使用已保存版本，未保存的编辑不会推送。", "保存失败保留填写内容及上一份成功配置，提示重试；提交中避免重复保存，成功后才更新展示状态。", "屏端沿用已有底部公告位：展示名称与内容、长文滚动；隐藏时不显示。公告列表/详情如展示该条也使用同一有效内容，不再保留矛盾旧值。", "沿用后台现有账号权限及站点管理范围，不向无权站点推送，不影响AI全民健身机；与屏端同步时机、长度上限和离线恢复由研发联调确定。", "本期不增加多条公告轮播、定时发布、审批或跨产品选择。"], "acceptance": ["页面始终可见仅支持全民运动站的提示，适用产品不可误选。", "创建、编辑、名称默认值、空内容校验、隐藏和重新展示正确。", "保存失败不覆盖有效公告；重复提交不生成重复公告。", "联调确认运动站同范围设备展示最新有效公告、隐藏生效，其他站点及全民健身机不受影响。"], "design": ["复用已有公告文字样式；后台新增菜单图标、表单、范围提示与展示状态，屏端复用底部现有公告位。"]}], "dependencies": ["后台研发核对当前视频接口、产品归属与权限字段，旧数据兼容和快速切换请求处理。", "后端及屏端研发确认公告读写、站点范围、更新/隐藏同步、离线恢复及长度上限。"], "tracking": "优先沿用现有视频查看、上传、编辑及保存事件，补充产品维度；公告创建/修改/显示开关沿用已有配置事件，若缺少再补。无新增运营统计需求，评审控件不进入生产埋点。"}</script><script>
const requirements=JSON.parse(document.querySelector('#requirements').textContent),$=s=>document.querySelector(s);
const icons={machine:'<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2"><rect x="13" y="3" width="22" height="35" rx="3"/><path d="M18 33h12M24 38v6M16 45h16"/><circle cx="24" cy="12" r="2"/><path d="M24 15v8m-6-6 6 3 6-3m-6 6-4 6m4-6 4 6"/></svg>',station:'<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="8" width="42" height="26" rx="3"/><path d="M12 34v10m24-10v10M8 44h8m16 0h8"/><circle cx="17" cy="17" r="2"/><path d="M17 20v6m-5-5 5 2 5-2m-5 5-3 5m3-5 3 5"/><circle cx="32" cy="17" r="2"/><path d="M32 20v6m-5-5 5 2 5-2m-5 5-3 5m3-5 3 5"/></svg>',play:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="m9 5 10 7-10 7z"/></svg>'};
const names={machine:'AI全民健身机',station:'AI全民运动站'},data={machine:{published:[['八段锦','传统武术'],['易筋经','传统武术'],['五禽戏','传统武术'],['八式太极拳','传统武术'],['有氧运动健康操','健康操'],['跳绳','体能']],draft:[['运动动作讲解','技能']]},station:{published:[['运动前的准备','运动准备'],['认识运动动作','动作讲解'],['体育小课堂','体育知识']],draft:[['公园运动小贴士','体育知识']]}};
let state={page:'videos',product:'machine',status:'published',scenario:'normal',help:false},saved=null,draft={name:'公告',content:''},toastTimer;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(s){$('#toast').textContent=s;$('#toast').hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').hidden=true,3000)}
function videos(){const rows=data[state.product][state.status];return `<h1>运动视频</h1><section class="panel"><div class="product-tabs" role="tablist" aria-label="适用产品">${Object.keys(names).map(k=>`<button id="tab-${k}" role="tab" class="product-tab" data-product="${k}" aria-selected="${state.product===k}" aria-controls="video-list" tabindex="${state.product===k?0:-1}">${icons[k]}<span><b>${names[k]}</b><small>${k==='machine'?'竖屏设备':'横屏设备'}</small></span></button>`).join('')}</div><div class="toolbar"><div class="status-tabs" role="group" aria-label="视频状态"><button data-status="published" class="${state.status==='published'?'active':''}" aria-pressed="${state.status==='published'}">已发布视频</button><button data-status="draft" class="${state.status==='draft'?'active':''}" aria-pressed="${state.status==='draft'}">草稿箱</button></div><button class="primary" id="upload">＋ 上传视频</button></div><div id="video-list" role="tabpanel" aria-labelledby="tab-${state.product}" aria-live="polite">${state.scenario==='failed'?'<div class="empty"><b>视频列表加载失败</b><p>请稍后重试</p><button id="retry">重新加载</button></div>':state.scenario==='empty'?'<div class="empty"><b>暂无视频</b><p>当前产品下还没有对应状态的视频</p></div>':`<div class="table-wrap"><table><thead><tr>${['序号','视频预览','视频名称','标签','点赞数','来源','创建人','发布时间','操作'].map(x=>'<th>'+x+'</th>').join('')}</tr></thead><tbody>${rows.map((r,i)=>`<tr><td>${i+1}</td><td><button class="preview" data-preview="${i}" aria-label="预览${esc(r[0])}">${icons.play}</button></td><td>${esc(r[0])}</td><td><span class="tag">${esc(r[1])}</span></td><td>${state.status==='draft'?'—':12+i*7}</td><td>共享视频库</td><td>系统共享</td><td>${state.status==='draft'?'—':'2026-11-06 09:00'}</td><td><button class="text-button" data-edit="${i}">编辑</button></td></tr>`).join('')}</tbody></table></div><div class="list-meta"><span>共 ${rows.length} 条</span><span>${names[state.product]}</span></div>`}</div></section>`}
function notice(){return `<h1>公告设置</h1><section class="panel"><div class="scope-alert" role="note"><b>公告仅支持在 AI全民运动站展示，不支持 AI全民健身机。</b></div><div class="notice-layout"><form id="notice-form" novalidate><div class="form-row"><label>适用产品</label><span class="fixed-product">${icons.station}AI全民运动站</span><p class="hint">适用范围沿用当前账号管理的公园与站点</p></div><div class="form-row"><label for="notice-name">公告名称</label><input id="notice-name" value="${esc(draft.name)}" placeholder="公告"><p class="hint">留空时使用“公告”</p></div><div class="form-row"><label for="notice-content">公告内容 <span aria-hidden="true">*</span></label><textarea id="notice-content" required placeholder="请输入要展示的公告内容" aria-describedby="notice-error">${esc(draft.content)}</textarea></div><div class="error" id="notice-error" role="alert"></div><div class="notice-state">当前状态：<span class="${saved?.visible?'state-pill':''}" id="notice-state">${!saved?'未创建':saved.visible?'展示中':'已隐藏'}</span></div><div class="actions"><button class="primary" type="submit">${saved?'保存并展示':'创建并展示'}</button>${saved?`<button type="button" id="notice-visibility">${saved.visible?'隐藏公告':'重新展示已保存公告'}</button>`:''}</div></form><div class="notice-preview"><h2>AI全民运动站展示预览</h2><div class="preview-frame"><h3>示例社区公园</h3><div class="preview-content">运动内容区域</div><div class="preview-notice" id="notice-preview-line" ${saved&&!saved.visible?'hidden':''}><b id="preview-name">${esc(draft.name.trim()||'公告')}</b><span id="preview-content">${esc(draft.content.trim()||'填写公告后，在这里查看展示位置')}</span></div></div><p class="hint">预览填写内容；保存成功后才更新屏端公告。</p></div></div></section>`}
function renderHelp(){const f=requirements.features[state.page==='videos'?0:1];$('#help').hidden=!state.help;$('#help-toggle').setAttribute('aria-expanded',String(state.help));$('#help').innerHTML=`<span class="id">${f.id}</span><h2>${esc(f.title)}</h2><p>${esc(f.scope)}</p><h3>功能与规则</h3><ol>${f.rules.map(x=>'<li>'+esc(x)+'</li>').join('')}</ol><h3>验收</h3><ul>${f.acceptance.map(x=>'<li>'+esc(x)+'</li>').join('')}</ul><p>演示不连接真实后台或设备。视频预览、上传、编辑只示意当前产品归属，真实流程沿用原后台。</p>`}
function render(){state.page=location.hash==='#notice'?'notice':'videos';$('#view').innerHTML=state.page==='videos'?videos():notice();$('#crumb').textContent='内容管理 / '+(state.page==='videos'?'运动视频':'公告设置');document.querySelectorAll('[data-page]').forEach(x=>x.classList.toggle('active',x.dataset.page===state.page));$('#scenario').value=state.scenario;renderHelp()}
function saveNotice(e){e.preventDefault();const content=draft.content.trim();if(!content){$('#notice-error').textContent='请填写公告内容';$('#notice-content').setAttribute('aria-invalid','true');$('#notice-content').focus();return}if(state.scenario==='saveFailed'){$('#notice-error').textContent='保存失败，请重试；当前展示配置未改变。';return}saved={name:draft.name.trim()||'公告',content,visible:true};draft={name:saved.name,content:saved.content};render();toast('公告已保存，仅在 AI全民运动站展示（模拟）')}
document.addEventListener('click',e=>{const page=e.target.closest('[data-page]');if(page){location.hash=page.dataset.page;render();return}const product=e.target.closest('[data-product]');if(product){state.product=product.dataset.product;state.status='published';render();return}const status=e.target.closest('[data-status]');if(status){state.status=status.dataset.status;render();return}if(e.target.closest('#retry')){state.scenario='normal';render();return}if(e.target.closest('#upload'))toast('上传入口：'+names[state.product]+'（沿用现有流程，未实际上传）');if(e.target.closest('[data-preview]'))toast('视频预览：'+names[state.product]+'（未接入真实媒体）');if(e.target.closest('[data-edit]'))toast('编辑入口：'+names[state.product]+'（沿用现有流程）');if(e.target.closest('#notice-visibility')&&saved){if(state.scenario==='saveFailed'){$('#notice-error').textContent='设置失败，请重试；当前展示配置未改变。';return}saved.visible=!saved.visible;render();toast(saved.visible?'已重新展示已保存公告（模拟）':'已隐藏公告（模拟）')}});
document.addEventListener('input',e=>{if(e.target.id==='notice-name'||e.target.id==='notice-content'){draft[e.target.id==='notice-name'?'name':'content']=e.target.value;$('#preview-name').textContent=draft.name.trim()||'公告';$('#preview-content').textContent=draft.content.trim()||'填写公告后，在这里查看展示位置';$('#notice-error').textContent='';$('#notice-content').removeAttribute('aria-invalid')}});
document.addEventListener('submit',e=>{if(e.target.id==='notice-form')saveNotice(e)});
document.addEventListener('keydown',e=>{if(e.target.matches('[data-product]')&&['ArrowLeft','ArrowRight','Home','End'].includes(e.key)){e.preventDefault();state.product=e.key==='Home'?'machine':e.key==='End'?'station':state.product==='machine'?'station':'machine';state.status='published';render();$('#tab-'+state.product).focus()}});
$('#scenario').onchange=e=>{state.scenario=e.target.value;render()};$('#reset').onclick=()=>{state={page:'videos',product:'machine',status:'published',scenario:'normal',help:state.help};saved=null;draft={name:'公告',content:''};render();toast('演示数据已重置')};$('#help-toggle').onclick=()=>{state.help=!state.help;renderHelp()};window.addEventListener('hashchange',render);render();
</script></body></html>
