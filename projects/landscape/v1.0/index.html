function rankingValue(user,metric='duration'){return metric==='calories'?Math.round(user.kcal):user.seconds}
function rankedUsers(metric='duration'){const key=metric==='calories'?'kcal':'seconds';return rankingUsers.filter(u=>Number.isFinite(u[key])&&u[key]>=0).sort((a,b)=>rankingValue(b,metric)-rankingValue(a,metric)||a.id.localeCompare(b.id)).map((u,i,arr)=>({...u,rank:arr.findIndex(x=>rankingValue(x,metric)===rankingValue(u,metric))+1})).slice(0,10)}
function rankingDisplay(user,metric='duration'){return metric==='calories'?rankingValue(user,metric)+' 千卡':rankTime(user.seconds)}
function rankTime(seconds){return Math.floor(seconds/60)+'分'+String(seconds%60).padStart(2,'0')+'秒'}

function rotateHomeRecommendations(){const row=$('.quick-row');if(homeRecommendationBlocked())return false;homeQuickIndices.forEach((value,i)=>{homeQuickIndices[i]=(value+1)%homeQuickPools[i].length});row.innerHTML=homeQuickPools.map((_,i)=>homeQuickButton(i)).join('');homeQuickElapsed=0;homeQuickLastTick=homeRecommendationTimer!==null?Date.now():null;updateHomeRecommendationCue();return true}
function tickHomeRecommendation(){if(homeRecommendationBlocked()){pauseHomeRecommendationTimer();return;}const now=Date.now();if(homeQuickLastTick!==null)homeQuickElapsed=Math.min(HOME_ROTATION_MS,homeQuickElapsed+Math.max(0,now-homeQuickLastTick));homeQuickLastTick=now;updateHomeRecommendationCue();if(homeQuickElapsed>=HOME_ROTATION_MS)rotateHomeRecommendations()}

function quickIcon(kind){const paths={arms:'<circle cx="12" cy="4" r="2"/><path d="M12 8v7M3 9h18M12 15l-4 6M12 15l4 6"/>',balance:'<circle cx="12" cy="4" r="2"/><path d="M12 8v7M5 11l7-3 7 3M12 15l-2 6M12 15l8 3"/>',reaction:'<path d="m14 2-8 12h6l-2 8 8-12h-6z"/>',goal:'<path d="M3 21V5h18v16M3 10h18M3 15h18M8 5v16M16 5v16"/><circle cx="12" cy="14" r="4"/>',warmup:'<circle cx="12" cy="4" r="2"/><path d="M12 8v6M4 8l8 3 8-3M12 14l-5 7M12 14l5 7M3 4l2-2M19 2l2 2"/>',knees:'<circle cx="13" cy="4" r="2"/><path d="m12 8-3 6 6 2 3-4h3M12 9l4 3 3-3M9 14l-3 6H3M15 16l-2 5M5 8h3"/>',fruit:'<path d="M12 7c-3-4-8-1-8 4 0 5 3 10 6 10l2-1 2 1c3 0 6-5 6-10 0-3-2-5-4-5M12 7V4M12 4c1-3 4-3 6-2-1 3-3 4-6 2M2 20 22 4"/>'};return `<span class="quick-icon" aria-hidden="true"><svg viewBox="0 0 24 24">${paths[kind]}</svg></span>`}
function home(){const picks=['baduan-standard','taiji-eight','gym-0'].map(id=>Object.values(catalogue).flat().find(c=>c.id===id));return `<div class="desktop"><div class="desktop-top"><h1>今天，一起动起来</h1><div class="service-line home-service-links"><button data-action="rankings"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3h10v6a5 5 0 0 1-10 0V3ZM7 5H3v3a4 4 0 0 0 4 4M17 5h4v3a4 4 0 0 1-4 4M12 14v6M8 21h8"/></svg><b>今日运动榜</b></button><button data-action="openRecordQr" aria-haspopup="dialog"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12v18H6zM9 7h6M9 11h6M9 15h3"/></svg><span>运动记录查询</span></button></div></div><div class="desktop-grid"><section class="widget"><div class="widget-title"><h2>一起跟练</h2><button class="text-link" data-action="courses">全部课程 →</button></div><div class="follow-shelf">${picks.map(c=>`<button class="shelf-item" data-home-course-id="${c.id}"><div class="shelf-cover">${movementThumbnail(c.title,'course')}</div><b>${c.title}</b><small>${c.label}</small></button>`).join('')}</div></section><section class="widget"><div class="widget-title"><h2>运动视频</h2><button class="text-link" data-library="media">全部视频 →</button></div>${resources.filter(x=>x.category==='media').map(x=>`<button class="video-row" data-resource="${x.id}"><span class="video-thumb">${movementThumbnail(x.title,'media')}</span><span><b>${x.title}</b><small>${x.topic}</small></span></button>`).join('')}</section></div><div class="quick-recommendations"><div class="quick-row" aria-label="轻松运动推荐">${homeQuickPools.map((_,i)=>homeQuickButton(i)).join('')}</div><span class="quick-update-cue" role="timer" aria-live="off" hidden></span></div></div>`}

function movementThumbnail(title,type){let kind='stretch';if(/跳绳/.test(title))kind='rope';else if(/引体/.test(title))kind='pullup';else if(/俯卧撑/.test(title))kind='pushup';else if(/仰卧起坐/.test(title))kind='situp';else if(/坐姿|椅子起立/.test(title))kind='seated';else if(/燕式/.test(title))kind='balance';else if(/单腿|外摆腿/.test(title))kind='sideleg';else if(/体前屈/.test(title))kind='bend';else if(/抬腿|提膝|跑/.test(title))kind='run';else if(/蹲|马步/.test(title))kind='squat';else if(/跳|波比/.test(title))kind='jump';else if(/太极/.test(title))kind='taiji';else if(/五禽/.test(title))kind='balance';else if(/平举|推天|招财|动作/.test(title))kind='arms';else if(/青春|风帆|旭日|少年/.test(title))kind='jump';else if(/提踵/.test(title))kind='calf';
const head=(x,y)=>`<circle cx="${x}" cy="${y}" r="4"/>`,paths={
stretch:head(32,12)+'<path d="M32 21v19M16 16l16 12 16-12M32 40 21 56M32 40l11 16"/>',
arms:head(32,12)+'<path d="M32 21v19M13 28h38M32 40 22 56M32 40l10 16"/>',
sideleg:head(30,11)+'<path d="M30 20v20M15 30l15-9 17 9M30 40l-4 16M30 40l24 7"/>',
calf:head(28,10)+'<path d="M28 19v20M16 28l12-7 12 7M28 39l-5 16h7M28 39l7 16h7M48 48V34m-4 4 4-4 4 4"/>',
run:head(34,11)+'<path d="m31 20-9 17 15 4 9-12h9M30 22l12 7 8-8M22 37 14 53H5M37 41l-6 15"/>',
squat:head(36,10)+'<path d="m34 19-7 17 15 7-8 12h15M27 36l-8 10-8 9h12M31 26H11"/>',
jump:head(32,11)+'<path d="M32 20v18M15 10l17 17 17-17M32 38 17 52M32 38l15 14M17 57h-6M47 57h6"/>',
seated:head(27,11)+'<path d="M27 20v18h18v17h9M27 25l15 7M17 30v15h18M17 45v12M35 45v12"/>',
pushup:head(48,28)+'<path d="m39 31-22 9-8 11M39 31l6 12v10h9M17 40 8 42M6 57h51"/>',
situp:head(22,25)+'<path d="m25 34 9 12 12-13 9 21M25 34l-6 11M34 46H16M9 57h48"/>',
balance:head(48,21)+'<path d="m40 27-14 9-16-8M26 36l8 19h9M30 34l16 6M32 32l10-17"/>',
bend:head(42,30)+'<path d="m34 32-13-8 4 17-9 15M25 41l14 15M34 32l3 18M34 32l12 15"/>',
rope:head(32,12)+'<path d="M32 21v18M17 30l15-7 15 7M32 39l-9 15M32 39l9 15M15 30C0 53 64 67 49 30"/>',
pullup:head(32,21)+'<path d="M8 9h48M16 10v15l16 8 16-8V10M32 33v14M32 47l-7 11M32 47l7 11"/>',
taiji:head(33,12)+'<path d="m32 21-4 17-13 17h-8M28 38l17 6 7 11M31 24 17 27l-6-8M31 25l13 7 10-5"/>'
};return `<span class="movement-thumb" data-motion-icon="${kind}" aria-hidden="true"><svg viewBox="0 0 64 64">${paths[kind]}</svg>${type==='media'||type==='course'?'<span class="movement-play">▷</span>':''}</span>`}

function courses(){const items=filteredCourses(),count=Math.max(1,Math.ceil(items.length/pageSize));state.catalogPage=Math.min(state.catalogPage,count-1);const visible=items.slice(state.catalogPage*pageSize,(state.catalogPage+1)*pageSize),filters=['全部',...new Set(catalogue[state.category].map(c=>c.family))];return heading('AI跟练','')+`<div class="catalogue-shell"><nav class="catalogue-categories" aria-label="课程大类">${categories.map(c=>`<button data-category="${c}" class="${state.category===c?'active':''}"><b>${c}</b><span>→</span></button>`).join('')}</nav><section class="catalogue-content"><div class="catalogue-toolbar"><div><b>${state.category}</b><span>${items.length}门课程</span></div></div><div class="catalogue-filters" aria-label="课程筛选">${filters.length>2?filters.map(f=>`<button data-filter="${f}" class="${state.filter===f?'active':''}" aria-pressed="${state.filter===f}">${f}</button>`).join(''):''}</div><div class="catalogue-grid">${visible.length?visible.map(c=>`<button class="library-card" data-course="${c.id}"><span class="library-card-top">${movementThumbnail(c.title,'course')}<span class="library-course-info"><small>${c.family}</small><b>${c.title}</b>${c.duration?`<span>${c.duration}</span>`:''}</span></span><span class="library-card-bottom"><span>${c.segments.length?'整套 / 分节':'整套跟练'}</span><span>查看课程 →</span></span></button>`).join(''):`<div class="catalogue-empty"><h2>课程准备中</h2></div>`}</div>${items.length>pageSize?`<div class="catalogue-pagination"><span></span><div><button data-page-step="-1" ${state.catalogPage===0?'disabled':''}>← 上一页</button><span>${state.catalogPage+1} / ${count}</span><button data-page-step="1" ${state.catalogPage>=count-1?'disabled':''}>下一页 →</button></div></div>`:''}</section></div>`}

function exerciseModePicker(kind){
  const label=kind==='fitness'?'训练模式':'跟练模式';
  const active=state[kind+'Mode'];
  return `<div class="follow-people"><span>${label}</span><div role="group" aria-label="${label}">
    ${[['single','单人'],['multi','多人']].map(([mode,name])=>
      `<button data-${kind}-mode="${mode}" class="${active===mode?'active':''}" aria-pressed="${active===mode}">${name}</button>`).join('')}
  </div></div>`;
}
function detail(){const c=selectedCourse();return heading(c.title,'','courses',exerciseModePicker('follow'),c.label)+`<div class="lesson-layout activity-detail"><div class="lesson-visual activity-media"><div class="lesson-preview"><span class="lesson-play">▷</span><b>${c.title}</b></div>${c.duration?`<div class="lesson-meta"><span>${c.duration}</span></div>`:''}</div><section class="lesson-content activity-info" aria-label="整套与分节"><button class="lesson-whole ${state.playback==='full'?'active':''}" data-playback="full" aria-pressed="${state.playback==='full'}"><span><b>整套跟练</b><small>${c.title}</small></span>${c.duration?`<time>${c.duration}</time>`:''}<i>${state.playback==='full'?'✓':'▷'}</i></button>${c.segments.length?`<div class="lesson-chapter-heading"><h2>分节练习</h2><span>${c.segments.length}节</span></div><div class="lesson-chapters">${c.segments.map((seg,i)=>`<button class="lesson-chapter ${state.playback==='chapter'&&state.chapter===i?'active':''}" data-follow-chapter="${i}" aria-pressed="${state.playback==='chapter'&&state.chapter===i}"><span class="chapter-number">${String(i+1).padStart(2,'0')}</span><b>${chapterName(seg)}</b>${seg.duration?`<time>${seg.duration}</time>`:''}<i>${state.playback==='chapter'&&state.chapter===i?'✓':'▷'}</i></button>`).join('')}</div>`:''}<div class="lesson-start activity-primary">${btn('开始跟练 →',state.followMode==='multi'?'followGroupCalibration':'followCalibration','primary')}</div></section></div>`}

function game(){return gameDefinitions[state.game]||gameDefinitions['fruit-solo']}
function gameCount(){return Math.max(game().minPlayers,Math.min(game().maxPlayers,state.gamePlayers||game().count))}
function filteredGames(){return Object.values(gameDefinitions).filter(g=>g.id==='fruit-solo'&&g.category===state.gameCategory&&(state.gameFilter==='全部'||g.mode===state.gameFilter))}
function gameArt(kind){let content='';const circle=(x,y,r,fill)=>`<circle cx="${x}" cy="${y}" r="${r}" fill="${fill}"/>`;if(kind==='slice'){content=circle(52,69,25,'#ce6f42')+circle(108,52,22,'#8aa663')+'<path d="M49 43q8-15 21-11M106 28q2-13 15-13" fill="none" stroke="#4c6f42" stroke-width="6"/><path d="M23 96 132 18" stroke="#fff" stroke-width="5"/>';}else if(kind==='collect'){content='<path d="M25 22h34v30h42v-30h31M25 94h34V70h42v24h31" fill="none" stroke="#b1c19f" stroke-width="10"/>'+[25,50,77,104,131].map(x=>circle(x,60,5,'#bd863a')).join('')+circle(24,60,12,'#295e48');}else if(kind==='goal'){content='<path d="M28 98V26h104v72M28 50h104M28 74h104M54 26v72M80 26v72M106 26v72" fill="none" stroke="#9aac8b" stroke-width="3"/>'+circle(99,55,19,'#fcfdf8')+'<path d="m99 40 13 9-5 15H92l-5-15Z" fill="#3c6249"/>';}else if(kind==='pose'){content=circle(80,24,12,'#708d59')+'<path d="M80 43v32M80 47 45 28M80 47l35-19M80 75l-25 31M80 75l25 31" fill="none" stroke="#3d6c4b" stroke-width="9" stroke-linecap="round"/>';}else if(kind==='rhythm'){content='<path d="M30 100V20M80 100V20M130 100V20" stroke="#bdcba9" stroke-width="4"/>'+circle(30,62,14,'#547c4a')+circle(80,35,14,'#bc7b3c')+circle(130,84,14,'#547c4a')+'<path d="M10 92h140" stroke="#315c43" stroke-width="4"/>';}else if(kind==='dodge'){content='<rect x="94" y="20" width="40" height="78" rx="5" fill="#c48a5c"/><path d="M70 55H26m0 0 15-15M26 55l15 15" stroke="#3f6e4b" stroke-width="7" fill="none"/>';}else if(kind==='mole'){content='<ellipse cx="80" cy="94" rx="52" ry="13" fill="#b8c6a4"/><path d="M47 91V63a33 33 0 0 1 66 0v28Z" fill="#9f7b55"/>'+circle(67,61,4,'#f8f8ed')+circle(94,61,4,'#f8f8ed');}else{content=[40,80,120].map((x,i)=>circle(x,45+i%2*33,17,i===1?'#bf8544':'#6e9758')).join('')+'<path d="M35 102h90" stroke="#c0cdae" stroke-width="5"/>';}return `<svg viewBox="0 0 160 120" aria-hidden="true">${content}</svg>`}
function games(){const g=gameDefinitions['fruit-solo'];return heading('趣味运动','')+`<div class="launch-games"><button class="single-game-card game-library-card" data-game="${g.id}"><span class="single-game-art">${gameArt(g.kind)}</span><span class="single-game-copy"><small>单人 · 反应挑战</small><b>${g.title}</b><span>挥臂切果 · ${g.seconds}秒</span></span><span class="single-game-action">查看玩法 <span aria-hidden="true">→</span></span></button></div>`}
function gameRules(){const g=game(),players=g.minPlayers===g.maxPlayers?g.count:g.minPlayers+'–'+g.maxPlayers,pk=g.mode==='双人PK'||g.mode==='分队PK';return heading(g.title,'','games')+`<div class="lesson-layout activity-detail"><div class="lesson-visual activity-media"><div class="lesson-preview activity-preview"><div class="game-rule-art">${gameArt(g.kind)}</div><b>${g.title}</b></div><div class="lesson-meta"><span>${g.motion}</span><span>${g.seconds}秒</span></div></div><section class="lesson-content activity-info" aria-label="玩法说明与操作"><div class="activity-info-scroll"><div class="row detail-tags"><span class="tag">${g.category}</span><span class="tag gray">${g.mode}</span>${g.category==='多人'?`<span class="tag gray">${players}人</span>`:''}</div><h2>玩法说明</h2><ol class="activity-steps">${g.rules.map(r=>`<li>${r}</li>`).join('')}</ol>${pk?`<div class="detail-fact"><span>计分方式</span><b>${g.mode==='分队PK'?'1、2号为A队 / 3、4号为B队':'比较双方完成次数'}</b></div>`:''}</div><div class="lesson-start activity-primary">${btn('去站位准备 →','gamePrepare','primary')}</div></section></div>`}
function gamePrepare(){if(game().id==='fruit-solo')return fruitPrepare();const g=game(),n=gameCount(),bound=['none','identityPending'].includes(state.scene)?0:state.scene==='partial'?Math.max(0,n-1):n,method=state.scene==='registered'?'新用户已注册':'人脸登录完成';return heading('运动准备',g.title,'gameRules')+`<div class="game-ready-layout"><div class="game-ready-zones" style="--n:${n}">${Array.from({length:n},(_,i)=>`<section class="game-ready-slot ${i<bound?'ready':''}"><span>${i+1}号活动区</span><b>${i<bound?'身份已关联':state.scene==='none'?'等待进入':'待登录 / 注册'}</b><small>${i<bound?method:'请面向屏幕'}${g.mode==='分队PK'?(i<2?' · A队':' · B队'):''}</small></section>`).join('')}</div><section class="panel game-ready-info"><h2>${bound} / ${n} 人身份已关联</h2>${g.minPlayers!==g.maxPlayers?`<div class="game-number-picks"><span>本场人数</span>${Array.from({length:g.maxPlayers-g.minPlayers+1},(_,i)=>i+g.minPlayers).map(v=>`<button data-game-count="${v}" class="${v===n?'active':''}">${v}人</button>`).join('')}</div>`:''}<p>面向屏幕完成人脸登录。<br>新用户注册后，即可关联本次运动。</p>${btn('开始本局 →','startGame','primary',bound===n?'':'disabled')}</section></div>`}

function gamePlaying(){if(game().id==='fruit-solo')return fruitPlaying();const g=game(),n=gameCount();return `<div class="row between" style="margin-bottom:22px"><div class="row"><h2 style="margin:0">${g.title}</h2><span class="tag">${g.mode}</span></div><span class="hint">${state.scene==='lost'?'有参与者离开区域 · 本场暂停':state.paused?'已暂停 · 不计时、不计分':g.kind==='rhythm'?'看准拍点，再挥动手臂':g.kind==='pose'?'跟随提示，保持动作':'保持在自己的区域'}</span></div><section class="playfield"><div class="game-scorebar"><span>${g.mode==='双人PK'||g.mode==='分队PK'?'本局累计':n===1?'本轮完成':'共同完成'} <b id="game-score">${state.gameScore}</b> 次</span><span>剩余 <b id="game-time">${state.gameTime}</b> 秒</span><span>${n}人 · ${g.mode==='分队PK'?'2对2':g.mode}</span></div><div class="play-lanes" id="play-lanes" style="--players:${n}">${Array.from({length:n},(_,i)=>gameLane(i)).join('')}</div></section>`}
function gameLane(i){const g=game(),score=state.gameScores[i]||0,seq=state.gameTurns[i]||0,disabled=state.paused||state.scene==='lost'?'disabled':'',header=`<div class="lane-label"><span>${i+1}号 ${g.mode==='分队PK'?(i<2?'· A队':'· B队'):''}</span><b id="lane-score-${i}">${score}次</b></div>`;let body='';const positions=[[22,22],[63,45],[42,66],[71,23],[18,66]];if(g.kind==='collect'){const dots=state.mazeDots[i]||[],pos=state.mazePos[i]||[0,0];body=`<div class="maze-board">${Array.from({length:35},(_,cell)=>{const x=cell%7,y=Math.floor(cell/7),wall=mazeWall(x,y),dot=dots.includes(cell),player=x===pos[0]&&y===pos[1];return `<span class="maze-cell ${wall?'wall':''}">${player?'<i class="maze-explorer"></i>':dot?'<i class="maze-dot"></i>':''}</span>`}).join('')}</div><div class="lane-instruction">小幅侧移，带角色收集星点</div>`;}else if(g.kind==='pose'){const hold=state.poseRemaining[i]||0;body=`<div class="pose-figure">${gameArt('pose')}</div><div class="lane-instruction">双臂抬起，舒展站立</div><button class="pose-trigger" data-pose="${i}" ${disabled}>${hold?'保持中 · '+hold+'秒':'保持3秒'}</button>`;}else if(g.kind==='dodge'){const safe=seq%2===0?'left':'right';body=`<div class="dodge-board"><div class="obstacle ${safe==='left'?'right':'left'}">障碍</div><button class="dodge-safe ${safe}" data-game-hit="${i}" ${disabled}>${safe==='left'?'← 向左':'向右 →'}</button></div><div class="lane-instruction">向空的一侧小幅侧移</div>`;}else if(g.kind==='rhythm'){const relayTurn=Math.floor((g.seconds-state.gameTime)/2)%gameCount(),allowed=g.id!=='beat-team'||i===relayTurn,open=state.gameTime%2===0&&allowed;body=`<div class="rhythm-pulse ${open?'open':''}"><span>${!allowed?'等待接力':open?'现在击拍':'等待拍点'}</span></div><button class="beat-trigger" data-game-hit="${i}" ${disabled||(!allowed?'disabled':'')}>挥拍</button><div class="lane-instruction">绿圈亮起时命中</div>`;}else{let targets=g.kind==='slice'?3:1;body=`<div class="target-court ${g.kind==='goal'?'goal-court':''}">${Array.from({length:targets},(_,j)=>{const [x,y]=positions[(seq+j)%positions.length];return `<button class="motion-target ${g.kind}" data-game-hit="${i}" data-target="${j}" style="left:${x}%;top:${y}%" ${disabled} aria-label="${i+1}号${g.kind==='slice'?'切水果':g.kind==='goal'?'挡球':g.kind==='mole'?'打地鼠':'触达目标'}">${g.kind==='slice'?'<span class="fruit-leaf"></span><span class="fruit-cut"></span>':g.kind==='goal'?'<span class="ball-center"></span>':g.kind==='mole'?'<span class="mole-eyes">··</span>':'触达'}</button>`}).join('')}</div><div class="lane-instruction">${g.kind==='slice'?'挥臂切果，连续命中':g.kind==='goal'?'伸手挡球，不必跳跃':g.kind==='mole'?'伸手击中冒出的目标':'伸手触达亮起的目标'}</div>`;}return `<section class="play-lane ${i===state.gameActivePlayer?'selected':''}" data-lane="${i}">${header}<div class="lane-body">${body}</div><div class="lane-feedback" id="lane-feedback-${i}">${state.gameFeedback[i]||'等待动作'}</div></section>`}
function gameResult(){const g=game();if(g.id==='fruit-solo')return fruitSettlement();const n=gameCount(),scores=state.gameScores.slice(0,n),pk=g.mode==='双人PK'||g.mode==='分队PK',a=g.mode==='分队PK'?(scores[0]+scores[1]):scores[0],b=g.mode==='分队PK'?(scores[2]+scores[3]):scores[1],outcome=pk?(a===b?'这一局，双方打平':(a>b?(g.mode==='分队PK'?'A队':'1号'):(g.mode==='分队PK'?'B队':'2号'))+'领先'):state.gameScore>=g.goal?(n===1?'本轮完成':'共同挑战完成'):'完成一局，继续加油';return heading(outcome,g.title+' · '+g.mode,'games')+`<div class="game-result-layout"><section class="panel"><span class="eyebrow">${pk?'对局结果':'本场结果'}</span><h2>${state.gameScore} 次有效完成</h2><div class="game-results-people">${scores.map((v,i)=>`<div><span>${i+1}号${g.mode==='分队PK'?' / '+(i<2?'A队':'B队'):''}</span><b>${v}次</b></div>`).join('')}</div><p class="hint">${pk?'只比较本局同规则的结果，不与其他项目混排。':(n===1?'':'共同结果为各参与者之和。')}<br></p><p class="result-report-status ${demoReportState().status}" data-report-status="${demoReportState().status}">${demoReportState().text}</p></section><section class="panel game-result-actions"><div class="result-records"><h2>我的运动记录</h2>${qrMarkup()}<b>微信扫码查看</b><p class="hint">登录小程序，查看自己的运动记录</p></div><div class="result-replay-actions">${btn(n===1?'再玩一次':'同组再玩','gamePrepare','primary')}${btn('更多'+g.category+'项目','games')}</div></section></div>`}
function settlementMetrics(metrics){
  return `<dl class="settlement-metrics">${metrics.map(([label,value,unit],index)=>`

function groupReportChart(people,times,compact=false){
  const width=compact?1000:710,height=compact?173:337;
  const left=56,right=width-30,top=28,bottom=height-45;
  const maxCount=Math.max(10,Math.ceil(Math.max(...people.map(person=>person.counts.at(-1)))/10)*10);
  const x=seconds=>left+(right-left)*seconds/Math.max(1,times.at(-1));
  const y=count=>bottom-(bottom-top)*count/maxCount;
  const ticks=Array.from({length:maxCount/10+1},(_,index)=>index*10);
  return `<svg viewBox="0 0 ${width} ${height}" role="img" aria-label="${compact?'本次运动随时间变化的累计完成次数':'各参与者随项目时间变化的累计完成次数，曲线颜色与参与者列表对应'}">
    ${ticks.map(value=>`<line class="group-chart-grid" x1="${left}" x2="${right}" y1="${y(value)}" y2="${y(value)}"/><text x="42" y="${y(value)}" dy=".3em" text-anchor="end">${value}</text>`).join('')}
    ${times.map(seconds=>`<text x="${x(seconds)}" y="${height-14}" text-anchor="middle">${fmt(seconds)}</text>`).join('')}
    <path class="group-chart-axis" fill="none" d="M${left},${top}V${bottom}H${right}"/>
    ${people.map(person=>{
      const path=person.counts.map((count,index)=>`${index===0?'M':'L'}${x(times[index])},${y(count)}`).join(' ');
      return `<g class="group-curve" data-group-curve="${person.id}" style="color:${person.color}">
        <title>${esc(person.name)}</title>
        <path d="${path}" stroke-dasharray="${person.dash||'none'}"/>
        <circle cx="${x(times.at(-1))}" cy="${y(person.counts.at(-1))}" r="4.5"/>
      </g>`;
    }).join('')}
  </svg>`;
}

function rankGroupResults(people){
  const ordered=people.map(person=>({...person,completed:person.counts.at(-1)}))
    .sort((a,b)=>b.completed-a.completed||a.id-b.id);
  return ordered.map(person=>({...person,rank:ordered.findIndex(entry=>entry.completed===person.completed)+1}));
}

function groupSettlement(title,kind,count){
  const follow=kind==='follow',back=follow?'detail':'resourceDetail';
  const result=currentExerciseResult();
  const times=result?exerciseReportTimes(result.seconds):groupReportTimes[kind];
  const people=result?result.people.map(person=>({...groupReportPeople[person.id-1],...person,
    perfect:person.counts[0],great:person.counts[1],kcal:Math.round(person.count/3),
    counts:times.map(t=>person.timeline[t]??0)})):
    groupReportPeople.slice(0,count).map((person,index)=>({id:index+1,...person,...person[kind]}));
  const ranked=rankGroupResults(people);
  const medals=['gold','silver','bronze'];
  const meta=`<div class="group-report-meta"><span class="tag">多人 · ${count} 人</span><div class="group-report-duration"><span>项目时长</span><strong>${fmt(times.at(-1))}</strong></div></div>`;

          <tbody>${ranked.map(person=>`<tr style="--series:${person.color}"${person.rank<=medals.length?` data-medal="${medals[person.rank-1]}"`:''}>

$('#app').addEventListener('click',event=>{
  const button=event.target.closest('[data-select-curve]');
  if(!button)return;
  const report=button.closest('.group-report');
  const id=button.getAttribute('aria-pressed')==='true'?'':button.dataset.selectCurve;
  report.classList.toggle('has-focus',Boolean(id));
  report.querySelectorAll('[data-select-curve]').forEach(item=>{
    const selected=item.dataset.selectCurve===id;
    item.setAttribute('aria-pressed',String(selected));
    item.closest('tr').classList.toggle('selected',selected);
  });
  report.querySelectorAll('[data-group-curve]').forEach(curve=>curve.classList.toggle('selected',curve.dataset.groupCurve===id));
});

function prepareExerciseRoute(page){
  const route=exercisePages[page];
  if(!route){
    state.exercise=null;
    if(!isExerciseSettlement(page))state.exerciseResult=null;
    return;
  }
  if(route.kind==='fitness'&&resource().category!=='fitness'){
    Object.assign(state,{resourceId:'fitness-1',resourceCategory:'fitness',resourceReturn:'library'});
  }
  state.paused=false;
  if(route.live&&state.exercise?.kind===route.kind&&state.exercise.people.length)return;
  state.exerciseResult=null;
  state[route.kind+'Mode']=route.group?'multi':'single';
  state.exercise={
    kind:route.kind,group:Boolean(route.group),elapsed:0,countdown:0,
    duration:route.kind==='fitness'?40:205,
    slots:Array.from({length:route.group?8:1},()=>({present:false,stand:0,raised:false,hand:0})),
    selected:0,people:[],last:0
  };
  if(route.live)state.exercise.people=[exercisePerson(0)];
}

  if(slot.raised)return `右手确认 ${(slot.hand/1000).toFixed(1)}s`;

      if(command==='fill')round.slots.forEach(entry=>{entry.present=true});

      if(command==='leave'){
        Object.assign(slot,{present:false,stand:0,raised:false,hand:0});
        round.countdown=0;

      if(command==='raise'&&slotReady(slot))slot.raised=true;

  bar.innerHTML=route.live?`<strong>评审演示</strong><span>成绩随模拟动作更新</span>

function startExerciseRun(){
  const round=state.exercise;
  round.people=round.slots.flatMap((slot,i)=>slotReady(slot)?[exercisePerson(i)]:[]);
  if(!round.people.length)return;
  if(!round.people.some(person=>person.id===round.selected+1))round.selected=round.people[0].id-1;
  nav(round.kind==='fitness'?'fitnessTraining':'followTraining');
}
function tickExerciseCalibration(delta){
  const round=state.exercise;
  if(round.countdown){
    round.countdown-=delta;
    if(round.countdown<=0){startExerciseRun();return;}
  }
  for(const slot of round.slots){
    if(!slot.present||slotReady(slot))continue;
    slot.stand=Math.min(exerciseHoldMs,slot.stand+delta);
    if(!round.group&&slotReady(slot))round.countdown=exerciseHoldMs;
  }
  for(const slot of round.slots){
    if(slotReady(slot)&&slot.raised)slot.hand=Math.min(exerciseHoldMs,slot.hand+delta);
  }
  if(round.slots.some(slot=>slot.hand===exerciseHoldMs)){startExerciseRun();return;}
  syncExerciseCalibration();
}
function recordExerciseSecond(second,round){
  for(const person of round.people){
    const offset=person.id-1,cadence=2+offset%3;
    if(person.present&&(second+offset)%cadence===0){
      person.count++;
      if(round.kind==='follow'){
        const rating=(person.count-1+offset)%followRatingLabels.length;
        person.counts[rating]++;
        const expected=Math.floor((round.duration+offset)/cadence)-Math.floor(offset/cadence);
        // The prototype demonstrates scores increasing as simulated motions complete.
        person.score=Math.round((96-offset*3)*person.count/expected);
        person.feedback=followRatingLabels[rating];
      }
    }
    person.timeline[second]=person.count;
  }
}
function tickExercise(){
  const round=state.exercise,now=performance.now(),delta=now-round.last;
  round.last=now;
  const route=exercisePages[state.page];
  const blocked=exercisePreviewBlocked();
  if(!route.live){if(!blocked)tickExerciseCalibration(delta);return;}
  if(blocked||state.paused||exerciseAreaEmpty(round)){syncExerciseVideo(true);return;}
  const previous=Math.floor(round.elapsed/1000);
  round.elapsed=Math.min(round.duration*1000,round.elapsed+delta);
  const current=Math.floor(round.elapsed/1000);
  for(let second=previous+1;second<=current;second++)recordExerciseSecond(second,round);
  if(round.elapsed===round.duration*1000){finishExerciseRun();return;}
  syncExerciseTraining();
}
function finishExerciseRun(){
  const round=state.exercise;
  const seconds=Math.floor(round.elapsed/1000);

  nav(round.kind==='fitness'?'fitnessReport':'followReport',false);
}

function summarizeFruitRound(swings, remainingSeconds, effectiveSwingMs){
  let cut=0, centers=0, longest=0, baseScore=0, centerScore=0, comboScore=0;
  // Each group contains the fruits cut by one hand in one swing.
  for(const hits of swings){
    cut+=hits.length;
    longest=Math.max(longest,hits.length);
    for(const [index,hit] of hits.entries()){
      const points=fruitHitScore(hit,index);
      baseScore+=points.base;
      centers+=Number(hit.center);
      centerScore+=points.center;
      comboScore+=points.combo;
    }
  }
  const title=fruitResultTitle(remainingSeconds,cut,centers,longest);
  return Object.freeze({title,cut,centers,longest,baseScore,centerScore,comboScore,
    total:baseScore+centerScore+comboScore,effectiveSwingMs});
}

function fruitResultTitle(remainingSeconds,cut,centers,longest){
  if(remainingSeconds>0)return '本局提前结束';
  if(longest>=3)return `一挥切中 ${longest} 个`;
  if(centers>0)return '切中果心了';
  if(cut>0)return `这一局切中了 ${cut} 个水果`;
  return '跟着手部光点再试一次';
}

function fruitResultFromSwingSizes(swingSizes, centers, remainingSeconds, effectiveSwingMs, strawberries=0){
  let hitIndex=0;
  const swings=swingSizes.map(size=>Array.from({length:size},()=>{
    const index=hitIndex++;
    return {center:index<centers,strawberry:index<strawberries};
  }));
  return summarizeFruitRound(swings,remainingSeconds,effectiveSwingMs);
}

function renderFruitReview(){

    bar=$('#fruit-review');
  }
  const prepare=state.page==='gamePrepare',playing=state.page==='gamePlaying';
  bar.hidden=game().id!=='fruit-solo'||!(prepare||playing||state.page==='gameRules');
  if(bar.hidden)return;
  const options=prepare?fruitPrepareOptions:
    playing?[['normal','实时试玩'],...fruitFeedbackOptions,['lost','离区暂停']]:[];
  bar.innerHTML=`<strong>水果切切乐评审</strong>
    <button class="tool" data-fruit-stage="gamePrepare" aria-pressed="${prepare}">站位准备</button>

      ${options.map(([value,label])=>`<button class="tool" data-fruit-scene="${value}" aria-pressed="${value===state.scene}">${label}</button>`).join('')}
    </div>`:''}`;
  bar.onclick=e=>{
    const button=e.target.closest('button');
    if(!button||state.modal||prototypeHelpState.open)return;
    const stage=button.dataset.fruitStage;
    if(stage&&stage!==state.page){
      if(stage==='gamePlaying'){
        state.scene=fruitFeedbackOptions[0][0];
        nav(stage,false);
      }else nav(stage);

      startFruitPrepare('detecting');

      applyScenario(button.dataset.fruitScene);
      bar.querySelector('[aria-pressed="true"][data-fruit-scene]')?.focus();

function visiblePrototypeHelpTarget(selector){try{return [...document.querySelectorAll(selector)].find(el=>{const style=getComputedStyle(el);return style.display!=='none'&&style.visibility!=='hidden'&&el.getClientRects().length})||null}catch{return null}}
function currentPrototypeHelpItems(){if(typeof prototypeHelpItems!=='function')return [];return prototypeHelpItems().filter(item=>item&&item.id&&visiblePrototypeHelpTarget(item.selector))}
function clippedPrototypeHelpRect(el,rawRect=null){const viewport=$('.viewport'),base=viewport.getBoundingClientRect(),r=rawRect||el.getBoundingClientRect();let box={left:Math.max(base.left,r.left),top:Math.max(base.top,r.top),right:Math.min(base.right,r.right),bottom:Math.min(base.bottom,r.bottom)};for(let parent=rawRect?el:el.parentElement;parent&&parent!==viewport;parent=parent.parentElement){const style=getComputedStyle(parent);if(/auto|scroll|hidden|clip/.test(style.overflowX+' '+style.overflowY)){const clip=parent.getBoundingClientRect();box.left=Math.max(box.left,clip.left);box.top=Math.max(box.top,clip.top);box.right=Math.min(box.right,clip.right);box.bottom=Math.min(box.bottom,clip.bottom)}}return box.right-box.left<8||box.bottom-box.top<8?null:{left:box.left-base.left,top:box.top-base.top,width:box.right-box.left,height:box.bottom-box.top}}
function prototypeHelpTextObstacles(){const obstacles=[],app=$('#app'),walker=document.createTreeWalker(app,NodeFilter.SHOW_TEXT),range=document.createRange();let node;while((node=walker.nextNode())){if(!node.textContent.trim())continue;const parent=node.parentElement,style=getComputedStyle(parent);if(style.display==='none'||style.visibility==='hidden'||!parent.getClientRects().length)continue;range.selectNodeContents(node);for(const rect of range.getClientRects()){const box=clippedPrototypeHelpRect(parent,rect);if(box)obstacles.push(box)}}app.querySelectorAll('button,input,select,textarea').forEach(el=>{if(!el.getClientRects().length)return;const box=clippedPrototypeHelpRect(el);if(box)obstacles.push(box)});return obstacles}
function prototypeHelpOverlap(a,b,pad=0){return Math.max(0,Math.min(a.left+a.width+pad,b.left+b.width)-Math.max(a.left-pad,b.left))*Math.max(0,Math.min(a.top+a.height+pad,b.top+b.height)-Math.max(a.top-pad,b.top))}
function positionPrototypeHelp(){
  prototypeHelpFrame=null;if(!prototypeHelpState.open)return;
  const layer=$('#prototype-help-layer'),occupied=[],obstacles=prototypeHelpTextObstacles();
  prototypeHelpState.items.forEach(item=>{
    const target=visiblePrototypeHelpTarget(item.selector),box=target&&clippedPrototypeHelpRect(target),marker=layer.querySelector('[data-help-target="'+item.id+'"]'),outline=layer.querySelector('[data-help-outline="'+item.id+'"]');
    if(!marker||!outline)return;if(target&&!$('#app').contains(target)){marker.hidden=outline.hidden=true;return;}marker.hidden=outline.hidden=!box;if(!box)return;
    Object.assign(outline.style,{left:box.left+'px',top:box.top+'px',width:box.width+'px',height:box.height+'px'});
    marker.classList.toggle('compact',target.matches('.back,.detail-category'));
    const size=marker.offsetWidth||26,gap=4,maxX=Math.max(0,layer.clientWidth-size),maxY=Math.max(0,layer.clientHeight-size),left=box.left-size-gap,right=box.left+box.width+gap,top=box.top-size-gap,bottom=box.top+box.height+gap,cx=box.left+(box.width-size)/2,cy=box.top+(box.height-size)/2;
    const nearLeft=[left,box.top+3],above=[cx,top],below=[cx,bottom],nearRight=[right,box.top+3],compact=(target.matches('button,input,select,textarea,.detail-category')&&box.height<80);
    const candidates=compact?[above,below,nearLeft,nearRight]:[nearLeft,[box.left+3,top],above,nearRight,below];
    candidates.push([cx,box.top-size-1],[cx,box.top+box.height+1],[box.left-size-1,box.top+3],[box.left+box.width+1,box.top+3],[left,cy],[right,cy],[box.left+box.width-size-3,top],[box.left+3,bottom],[box.left+box.width-size-3,bottom]);
    for(let step=1;step<=4;step++){const offset=step*(size+gap);candidates.push([left,box.top+offset],[right,box.top+offset],[box.left+offset,top],[box.left+offset,bottom],[left,box.top-offset],[right,box.top-offset])}
    let best=null,bestScore=Infinity;
    candidates.forEach(([rawX,rawY],index)=>{
      const trial={left:Math.max(0,Math.min(maxX,rawX)),top:Math.max(0,Math.min(maxY,rawY)),width:size,height:size};
      const collision=occupied.reduce((n,p)=>n+prototypeHelpOverlap(trial,p,2),0),text=obstacles.reduce((n,p)=>n+prototypeHelpOverlap(trial,p,1),0),clamp=Math.abs(trial.left-rawX)+Math.abs(trial.top-rawY),score=collision*10000+text*100+clamp*2+index*.01;
      if(score<bestScore){bestScore=score;best=trial}
    });
    occupied.push(best);Object.assign(marker.style,{left:best.left+'px',top:best.top+'px'});
  });
}
function schedulePrototypeHelpPosition(){if(prototypeHelpFrame!==null)cancelAnimationFrame(prototypeHelpFrame);prototypeHelpFrame=requestAnimationFrame(positionPrototypeHelp)}
function markPrototypeHelpSelection(){const chosen=prototypeHelpState.selected;$('#prototype-help-layer').querySelectorAll('[data-help-target],[data-help-outline]').forEach(el=>{const active=(el.dataset.helpTarget||el.dataset.helpOutline)===chosen;el.classList.toggle('selected',active);if(el.dataset.helpTarget)el.setAttribute('aria-pressed',String(active))});$('#prototype-help-list').querySelectorAll('[data-help-id]').forEach(el=>el.classList.toggle('selected',el.dataset.helpId===chosen));$('#prototype-help-list').querySelectorAll('[data-help-select]').forEach(el=>el.setAttribute('aria-pressed',String(el.dataset.helpSelect===chosen)))}
function selectPrototypeHelp(id,fromMarker=false){const item=prototypeHelpState.items.find(x=>x.id===id);if(!item)return;prototypeHelpState.selected=id;markPrototypeHelpSelection();if(fromMarker){$('#prototype-help-list').querySelector('[data-help-id="'+id+'"]')?.scrollIntoView({block:'nearest',inline:'nearest'})}else{const target=visiblePrototypeHelpTarget(item.selector);if(target){for(let parent=target.parentElement;parent&&parent!==$('#app');parent=parent.parentElement){if(/auto|scroll/.test(getComputedStyle(parent).overflowY)&&parent.scrollHeight>parent.clientHeight){const r=target.getBoundingClientRect(),pr=parent.getBoundingClientRect(),factor=$('.viewport').clientWidth/1600;if(r.top<pr.top||r.bottom>pr.bottom)parent.scrollTop+=(r.top-pr.top)/factor-12}}schedulePrototypeHelpPosition()}}}
function refreshPrototypeHelp(){const open=prototypeHelpState.open,panel=$('#prototype-help-panel'),layer=$('#prototype-help-layer');$('#help-toggle').setAttribute('aria-expanded',String(open));$('#prototype-review-layout').classList.toggle('help-open',open);panel.hidden=layer.hidden=!open;if(!open){layer.innerHTML='';return;}const items=currentPrototypeHelpItems();prototypeHelpState.items=items;const title=pages.find(p=>p[0]===state.page)?.[1]||'当前页面';$('#prototype-help-title').textContent=title+(state.modal?' · 弹窗':'');const signature=JSON.stringify([state.page,state.modal,items]);if(signature!==prototypeHelpState.signature){prototypeHelpState.signature=signature;if(!items.some(x=>x.id===prototypeHelpState.selected))prototypeHelpState.selected=items[0]?.id||null;$('#prototype-help-list').innerHTML=items.length?items.map((item,index)=>`<article class="prototype-help-item" data-help-id="${esc(item.id)}"><button class="prototype-help-select" data-help-select="${esc(item.id)}" aria-pressed="false"><span class="prototype-help-number">${index+1}</span><span>${esc(item.title)}</span>${$('#app').contains(visiblePrototypeHelpTarget(item.selector))?'':'<small class="prototype-help-scope">评审控件</small>'}</button><p>${esc(item.description)}</p><dl>${item.interaction?`<dt>操作</dt><dd>${esc(item.interaction)}</dd>`:''}${item.rule?`<dt>规则</dt><dd>${esc(item.rule)}</dd>`:''}</dl></article>`).join(''):'<p class="prototype-help-empty">当前页面暂无可定位的功能说明。</p>';layer.innerHTML=items.map((item,index)=>`<div class="prototype-help-box" data-help-outline="${esc(item.id)}"></div><button class="prototype-help-marker" data-help-target="${esc(item.id)}" aria-label="${index+1}：${esc(item.title)}" aria-pressed="false">${index+1}</button>`).join('')}markPrototypeHelpSelection();schedulePrototypeHelpPosition()}
function togglePrototypeHelp(force){const next=typeof force==='boolean'?force:!prototypeHelpState.open;if(next===prototypeHelpState.open)return;if(next){prototypeHelpState.returnFocus=document.activeElement;pauseHomeRecommendationTimer();prototypeHelpState.open=true;prototypeHelpState.signature='';refreshPrototypeHelp();requestAnimationFrame(scale)}else{prototypeHelpState.open=false;refreshPrototypeHelp();scale();if(state.page==='home')startHomeRecommendationTimer();const focus=prototypeHelpState.returnFocus;if(focus?.isConnected)focus.focus();else $('#help-toggle').focus();prototypeHelpState.returnFocus=null}}
$('#help-toggle').onclick=()=>togglePrototypeHelp();$('#help-close').onclick=()=>togglePrototypeHelp(false);
$('#prototype-help-layer').addEventListener('click',e=>{const b=e.target.closest('[data-help-target]');if(b)selectPrototypeHelp(b.dataset.helpTarget,true)});
$('#prototype-help-list').addEventListener('click',e=>{const b=e.target.closest('[data-help-select]');if(b)selectPrototypeHelp(b.dataset.helpSelect)});
$('.viewport').addEventListener('scroll',schedulePrototypeHelpPosition,true);

function openLocation(page){
  const params=new URLSearchParams(location.search);
  const sample=params.get('sample');
  const groupScene='multi'+params.get('participants');
  if(isExerciseSettlement(page)&&groupReportScenes.some(([scene])=>scene===groupScene)){
    state.scene=groupScene;
    if(page==='followReport')state.followMode='multi';
    else state.fitnessMode='multi';
    nav(page,false);
    return;
  }
  if((page==='gamePrepare'&&fruitPrepareOptions.some(([id])=>id===sample))||
    (page==='gamePlaying'&&isFruitFeedback(sample))){
    state.scene=sample;
    nav(page,false);
    return;
  }
  if(page==='gameResult'&&Object.hasOwn(fruitResultExamples,sample)){
    state.scene=sample;
    nav(page,false);
    return;
  }
  nav(page);
}
window.addEventListener('hashchange',()=>{
  const page=location.hash.slice(1)||'home';
  if(page!==state.page)openLocation(page);
});
openLocation(location.hash.slice(1)||'home');
